questions:
  - "Your client, a 40,000-person Indian services firm, asks whether AI will let it cut its graduate intake. What evidence would you want before answering, and what would you tell them today?"
  - "Surveys show 32% of firms expected AI headcount cuts and 14% reported them a year later. Give three reasons the forecast and the outcome differ, and say what that means for a workforce plan."
  - "India is second in Claude.ai use but around 101st per capita, and 45% of its use is software tasks. Structure the opportunity for a non-IT Indian business function."
