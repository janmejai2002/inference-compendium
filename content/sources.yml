    - { t: "0:34",  label: "The same question with and without RLHF" }
    - { t: "5:02",  label: "Supervised fine-tuning: pretraining optimises for completion, not for what the user wants" }
    - { t: "6:52",  label: "Why raters compare two answers instead of scoring 1 to 10" }
    - { t: "8:20",  label: "Push the reward too hard and the model games it" }
    - { t: "9:20",  label: "Limits: subjective raters, no ground truth, bias from a narrow rater pool" }
  verified: true

