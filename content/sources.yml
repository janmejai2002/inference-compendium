  creator: IBM Technology
  publisher: YouTube
  year: 2024
  minutes: 11
  url: https://www.youtube.com/watch?v=T_X4XFwKX8k
  tier: B
  why: "Eleven minutes from IBM's official channel on the step that turns a text completer into an assistant: demonstrations, a reward model learned from human comparisons, and the limits, including rater bias. Skip 1:12 to 4:12 (general reinforcement-learning vocabulary)."
