kaplan-scaling-laws:
  type: paper
  title: "Scaling Laws for Neural Language Models"
  creator: Jared Kaplan et al.
  publisher: arXiv
  year: 2020
  url: https://arxiv.org/abs/2001.08361
  tier: A
  why: "The originating paper for why labs keep building bigger models: loss falls as a power law in size, data and compute. Read the abstract and Figure 1 only."
  verified: true

petrov-tokenizers:
  type: paper
