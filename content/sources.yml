ibm-predictive-vs-generative:
  type: video
  title: "Predictive vs Generative AI: How They Work and When to Use Each"
  creator: Martin Keen
  publisher: IBM Technology
  year: 2026
  minutes: 12
  url: https://www.youtube.com/watch?v=phOhGqpXss4
  tier: B
  why: "Twelve minutes that match this chapter: what each family outputs, what data it eats, the standard predictive use cases, and the churn-list-then-email combination. Skip 8:10 to 9:30 (transformers and diffusion; the next chapter covers the mechanism)."
