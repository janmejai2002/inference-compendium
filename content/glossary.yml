# GLOSSARY. Use [[id]] or [[id|display text]] in a chapter. The first use in each chapter
# puts the definition in the margin rail; every term is collected in the back-of-book glossary.
model:
  term: Model
  def: A rule, learned from examples, that turns an input into an output. A prediction machine.
parameter:
  term: Parameter
  def: One adjustable number inside a model (a "weight"). Training sets its value. Large language models have billions.
training:
  term: Training
  def: Adjusting a model's parameters, example after example, to shrink its error. Expensive, done once.
inference:
  term: Inference
  def: Using a trained model to produce an output. Cheap per use, done millions of times. The book is named after it.
token:
  term: Token
  def: The unit of text a language model reads and writes, roughly three-quarters of an English word.
llm:
  term: Large language model (LLM)
  def: A model trained to predict the next token of text, at a scale that makes it useful for writing, reasoning and conversation.
overfitting:
  term: Overfitting
  def: When a model memorises its training examples instead of the pattern, so it fails on new cases.
context-window:
  term: Context window
  def: The maximum number of tokens a model can take in at once, prompt and answer together. Anything outside it, the model cannot see.
tokenizer:
  term: Tokenizer
  def: The fixed rule that chops text into tokens before a model reads it. It decides how many tokens, and so how much money, a given text costs.
scaling-law:
  term: Scaling law
  def: The measured finding that a language model's next-token error falls smoothly and predictably as parameters, data and compute grow.
temperature:
  term: Temperature
  def: A setting that controls how often a model picks a less likely next token. Low is predictable; high is varied.
predictive-ai:
  term: Predictive AI
  def: Models that learn from past examples to score, classify or forecast a number for a new case (will this customer leave, how much milk sells tomorrow). Also called classic machine learning.
generative-ai:
  term: Generative AI
  def: Models, usually built on a foundation model, that produce new text, images, code or audio. One model can do many tasks and works on unstructured data.
rule-based-system:
  term: Rule-based system
  def: Software that follows if-then logic written by people. Transparent and predictable, but it only knows the rules someone thought to write.
structured-data:
  term: Structured data
  def: Data that fits rows and columns with a fixed meaning per column, like a transactions table. Unstructured data is free text, images, audio and video.
classification:
  term: Classification
  def: A prediction that puts a case into a category (fraud or not, will churn or not). Forecasting a number instead is called regression.
label:
  term: Label
  def: The known right answer attached to a past example (this loan defaulted, this account was a mule). A predictive model learns from labelled history.
prompt:
  term: Prompt
  def: The instructions and material you give a model in one request. Everything the model knows about your task comes from the prompt plus its training.
few-shot:
  term: Few-shot examples
  def: A handful of worked input-and-output examples placed in a prompt so the model copies the pattern. Zero-shot means no examples.
chain-of-thought:
  term: Chain of thought
  def: Asking a model to reason step by step before giving its answer. Reasoning models now do this on their own.
reasoning-model:
  term: Reasoning model
  def: A model trained to work through a problem internally before it answers. Slower and dearer per answer, better on multi-step tasks.
eval:
  term: Eval
  def: A fixed set of test questions with known good answers, run against a prompt or model to measure it, the way a mock exam measures a student.
retrieval-augmented-generation:
  term: Retrieval-augmented generation (RAG)
  def: Fetching the passages most relevant to a question from your own documents and pasting them into the prompt, so the model answers from them. The model's weights do not change.
embedding:
  term: Embedding
  def: A list of numbers that stands for the meaning of a piece of text, so that passages with similar meaning sit close together. Retrieval systems search by it.
chunk:
  term: Chunk
  def: A short passage (a paragraph or a few hundred words) cut from a longer document so it can be indexed and retrieved on its own.
data-fiduciary:
  term: Data Fiduciary
  def: Under India's DPDP Act 2023, whoever decides why and how personal data is processed. It stays responsible even when a vendor does the processing.
pretraining:
  term: Pretraining
  def: The first and largest stage of training an LLM, where it learns to predict the next token over a huge collection of text. The result completes documents; it is not yet an assistant.
fine-tuning:
  term: Fine-tuning
  def: Further training of a pretrained model on a smaller, chosen set of examples. Used two ways - to turn a completer into an assistant (format and behaviour), or to specialise a model in a domain's style and vocabulary.
rlhf:
  term: RLHF
  def: Reinforcement learning from human feedback. People compare pairs of model answers; a reward model learns their preferences; the LLM is trained to produce answers that score well.
hallucination:
  term: Hallucination
  def: A fluent, confident output that is false or unsupported, such as an invented citation or figure. It comes from the same next-token process that produces correct answers.
abstention:
  term: Abstention
  def: When a model declines to answer or says it does not know. Scoreboards that count only accuracy give an abstention zero, the same as a wrong guess.

agent:
  term: Agent
  def: An AI system that dynamically directs its own process, chooses tools, and takes actions in the world to accomplish a goal.
workflow:
  term: Workflow
  def: A system where large language models and tools are orchestrated through predefined, fixed code paths.
tool-call:
  term: Tool call
  def: A structured command from a model to an external software program (such as a database, browser or calculator) to fetch data or take action.
prompt-injection:
  term: Prompt injection
  def: A vulnerability where untrusted text or user inputs hijack an AI model's instructions, altering its behavior or triggering unauthorized actions.

automation-bias:
  term: Automation bias
  def: The tendency of humans to over-trust and passively accept automated suggestions, failing to notice omissions or errors even when trained.
jagged-frontier:
  term: Jagged frontier
  def: The uneven boundary of AI capability, where tasks of seemingly similar difficulty sit unpredictably inside or outside what a model can solve correctly.
base-rate:
  term: Base rate
  def: The underlying prevalence or prior probability of an event within a population before specific diagnostic evidence is considered.
precision:
  term: Precision
  def: The proportion of positive alerts or flags generated by a system that correspond to true, verified cases (true positives divided by total flags).

capex:
  term: Capital expenditure (capex)
  def: Funds spent by a company to acquire, upgrade, and maintain physical assets such as data centres, land, generators, and AI server clusters.
opex:
  term: Operational expenditure (opex)
  def: Ongoing day-to-day costs required to run a business or service, such as cloud API consumption fees, power bills, and maintenance.
remaining-performance-obligation:
  term: Remaining performance obligation (RPO)
  def: The total contracted, unearned revenue that a cloud or software vendor has signed with customers but has not yet delivered or billed.
inference-cost:
  term: Inference cost
  def: The direct computational and financial cost incurred by hardware to generate tokens and serve model predictions to users after training is complete.

ebit:
  term: Earnings before interest and taxes (EBIT)
  def: An accounting metric measuring a company's operating profit, isolating core operational performance from financing structures and tax rates.
workflow-redesign:
  term: Workflow redesign
  def: Restructuring operational processes, roles, and handoffs end to end to capture the full economic benefit of automation, rather than inserting AI tools into unchanged legacy routines.

occupational-exposure:
  term: Occupational exposure
  def: The degree to which the specific tasks comprising a job can be performed or augmented by artificial intelligence models.

skill-premium:
  term: Skill premium
  def: The percentage wage or compensation differential paid to workers possessing specialized, high-demand capabilities relative to peers with standard qualifications.

capacity-leakage:
  term: Capacity leakage
  def: The dissipation of hours saved through task automation into unstructured downtime or redundant revisions rather than captured enterprise output.

outcome-based-pricing:
  term: Outcome-based pricing
  def: A commercial fee structure where a professional services firm ties a portion of its advisory fees to the client achieving agreed-upon business performance metrics or operational milestones, rather than billing strictly for time and materials.

pyramid-model:
  term: Pyramid model
  def: The traditional organizational hierarchy of professional service firms where large cohorts of junior analysts perform routine drafting and analysis to support a smaller tier of partners, financing apprentice development through billable hourly rates.

guesstimate:
  term: Guesstimate
  def: A structured analytical exercise in consulting interviews where a candidate estimates an unknown market size, operational volume, or financial metric by decomposing the problem into transparent, defensible mathematical assumptions.

containment-rate:
  term: Containment rate
  def: The percentage of customer inquiries or support tickets resolved entirely by automated AI workflows without escalating to a human agent.

asynchronous-interview:
  term: Asynchronous video interview
  def: A structured recruitment evaluation where a candidate records responses to computerized prompts without a live human interviewer present, often evaluated by automated scoring algorithms or recorded for subsequent recruiter review.

resume-parsing:
  term: Resume parsing
  def: The automated extraction and semantic matching of skills, certifications, and employment history from candidate curriculum vitae documents against predefined job description parameters.

media-mix-modeling:
  term: Media mix modeling (MMM)
  def: A privacy-safe statistical technique that estimates the incremental sales impact and ROI of each marketing channel using aggregate historical spend and sales data, rather than individual user tracking.

synthetic-personas:
  term: Synthetic personas
  def: Simulated consumer profiles generated by large language models conditioned on demographic and behavioral prompts, used to pre-test copy, concepts, and messaging.

predictive-ltv:
  term: Predictive customer lifetime value (pLTV)
  def: A machine learning forecast of the net profit a business will generate from a customer over their entire future relationship, used to set acquisition spend limits.

creative-fatigue:
  term: Creative fatigue
  def: The decline in an ad's click-through and conversion rates over time as the target audience is repeatedly exposed to the same creative asset, driving up customer acquisition costs.

algorithmic-bias-ads:
  term: Algorithmic bias in advertising
  def: When automated ad-delivery algorithms systematically skew audience exposure or pricing along gender, caste, racial, or economic lines based on historical interaction patterns.

asci-guidelines:
  term: ASCI guidelines
  def: The regulatory advertising standards established by the Advertising Standards Council of India, mandating clear disclosure of synthetically generated content, virtual influencers, and material connections.

brand-safety-guardrails:
  term: Brand safety guardrails
  def: Automated filters, system prompts, and verification policies that prevent AI systems from generating defamatory, legally risky, inaccurate, or off-brand outputs in public-facing channels.

eval-harness:
  term: Evaluation harness (Eval harness)
  def: An automated test execution environment that runs a benchmark dataset through a model or agent pipeline, records system outputs, applies deterministic assertions or model-graded scoring, and outputs aggregate accuracy, latency, and cost metrics.

synthetic-evals:
  term: Synthetic evaluations
  def: Benchmark test suites, edge scenarios, and evaluation datasets programmatically generated by foundation models using parameter perturbation, adversary prompting, or rubric conditionings rather than manually curated by human annotators.

latency-budget:
  term: Latency budget
  def: The maximum allowable elapsed time allocated across each modular hop of an AI system (speech recognition, intent routing, context retrieval, prefill TTFT, token generation, and frontend rendering) to guarantee an interactive user experience SLA.

context-caching:
  term: Context caching
  def: An inference optimization where the precomputed key-value (KV) attention states of a static prompt prefix (documents, system prompts, few-shot examples) are preserved in GPU memory, drastically lowering time-to-first-token latency and input token pricing on subsequent API calls.

model-routing:
  term: Model routing
  def: An architectural mechanism that dynamically directs incoming queries to the most cost-effective and latency-efficient model (such as a local SLM, a code-specialized model, or a frontier reasoning model) based on estimated query complexity, intent classification, or confidence score thresholds.

agentic-ux:
  term: Agentic UX
  def: User interface design patterns engineered for semi-autonomous, proactive AI systems—moving beyond reactive conversational chat bubbles toward ambient heads-up displays (HUDs), interactive canvas surfaces, and graduated human-in-the-loop control gates.

credit-underwriting-engine:
  term: Credit underwriting engine
  def: An algorithmic software pipeline that combines structured applicant data (bureau scores, debt-to-income, cash flows) and unstructured inputs (bank statements, GST returns, invoices) to predict default risk and automatically approve, price, or decline a credit facility.

probability-of-default:
  term: Probability of default (PD)
  def: An empirical estimate of the likelihood that a borrower will fail to meet contractual debt obligations over a specified horizon (typically 12 months under Basel III and IFRS 9 Stage 1).

pd:
  term: Probability of default (PD)
  def: An empirical estimate of the likelihood that a borrower will fail to meet contractual debt obligations over a specified horizon (typically 12 months under Basel III and IFRS 9 Stage 1).

loss-given-default:
  term: Loss given default (LGD)
  def: The percentage of an exposure that a lender loses if a borrower defaults, after accounting for collateral liquidation, guarantees, and recovery expenses (LGD = 1 − Recovery Rate).

lgd:
  term: Loss given default (LGD)
  def: The percentage of an exposure that a lender loses if a borrower defaults, after accounting for collateral liquidation, guarantees, and recovery expenses (LGD = 1 − Recovery Rate).

exposure-at-default:
  term: Exposure at default (EAD)
  def: The total gross monetary amount a bank is exposed to at the exact moment of borrower default, comprising drawn balances and committed but undrawn credit facilities.

ead:
  term: Exposure at default (EAD)
  def: The total gross monetary amount a bank is exposed to at the exact moment of borrower default, comprising drawn balances and committed but undrawn credit facilities.

expected-credit-loss:
  term: Expected credit loss (ECL)
  def: The monetary value of credit losses a lender expects to absorb over an asset's lifetime, calculated under IFRS 9 and Ind AS 109 as the product of exposure, probability, and loss severity (ECL = EAD × PD × LGD).

ecl:
  term: Expected credit loss (ECL)
  def: The monetary value of credit losses a lender expects to absorb over an asset's lifetime, calculated under IFRS 9 and Ind AS 109 as the product of exposure, probability, and loss severity (ECL = EAD × PD × LGD).

financial-spreading:
  term: Financial spreading
  def: The process of extracting line items from balance sheets, income statements, and cash flow reports in varied document formats and standardizing them into a structured financial model for ratio analysis and credit evaluation.

rbi-free-ai:
  term: RBI FREE-AI framework
  def: "The Reserve Bank of India's governance framework for Responsible and Ethical Enablement of AI in financial services, organized around seven Sutras: fairness, accountability, transparency, resilience, consumer protection, privacy, and contestability."

mule-account-detection:
  term: Mule account detection
  def: Algorithmic identification of bank or digital wallet accounts that are created, rented, or hijacked to launder illicit funds and layer fraud proceeds across payment networks before extraction.

explainable-ai-finance:
  term: Explainable AI in finance (XAI)
  def: Interpretability methodologies (such as SHAP values, integrated gradients, and surrogate models) that explain individual model decisions to satisfy statutory adverse action notice and regulatory audit mandates.

shap-attribution:
  term: SHAP attribution
  def: A cooperative game-theoretic method that calculates Shapley values to quantify the exact marginal contribution of each input variable to a specific model prediction or credit decision.

shap:
  term: SHAP (SHapley Additive exPlanations)
  def: A cooperative game-theoretic method that calculates Shapley values to quantify the exact marginal contribution of each input variable to a specific model prediction or credit decision.

virtual-data-room:
  term: Virtual Data Room (VDR)
  def: A highly secure, audited online document repository used by investment bankers, private equity sponsors, and legal teams to share sensitive corporate filings during M&A due diligence.

vdr:
  term: Virtual Data Room (VDR)
  def: A highly secure, audited online document repository used by investment bankers, private equity sponsors, and legal teams to share sensitive corporate filings during M&A due diligence.

base-rate-fallacy:
  term: Base rate fallacy
  def: A statistical cognitive bias where decision-makers or alert systems focus on specific test indicators while ignoring the low prior probability (base rate) of an event, creating enormous false alarm volumes in low-incidence domains like fraud detection.

weight-of-evidence:
  term: Weight of evidence (WoE)
  def: A statistical measure used in classical credit scorecards that quantifies the log-odds ratio of default across binned feature segments, enforcing monotonic and auditable linear credit risk scores.

adverse-action-notice:
  term: Adverse action notice
  def: A formal regulatory statement provided to a loan applicant detailing the principal legal and financial reasons why their credit application was denied or offered on less favorable terms.

gnpa:
  term: Gross non-performing assets (GNPA)
  def: The total value of loans that a bank's borrowers have defaulted on or failed to service for more than 90 days, serving as the benchmark measure of a lending institution's credit quality.

alternative-data-credit:
  term: Alternative credit data
  def: Non-traditional information signals (including UPI payment velocity, utility bill records, GST filings, and e-commerce receipts) used to assess the creditworthiness of thin-file borrowers.

cell-level-audit-lineage:
  term: Cell-level audit lineage
  def: An immutable provenance trail linking every calculated number in a financial spreadsheet or valuation model directly back to the exact source page, table cell, and bounding box coordinates in the original filing.

deterministic-sandbox:
  term: Deterministic sandbox
  def: An isolated computational execution environment where an AI system runs programmatic code (such as Python, SQL, or Excel formulas) to execute financial arithmetic rather than relying on stochastic token generation.

covenant-monitoring:
  term: Covenant monitoring
  def: The continuous automated tracking of a borrower's operational and financial ratios (such as DSCR or leverage ceilings) against loan covenants to detect early technical distress before default occurs.

graph-neural-networks:
  term: Graph neural networks (GNNs)
  def: Deep learning models designed to process topological and relational graph structures, identifying hidden fraud rings, synthetic identities, and circular money laundering patterns invisible to tabular classifiers.

suspicious-transaction-report:
  term: Suspicious transaction report (STR)
  def: A mandatory regulatory document filed by a financial institution with a national financial intelligence unit (such as FIU-IND) whenever a transaction is suspected of criminal or money-laundering ties.

dpdp-financial-localization:
  term: Financial data localization
  def: Statutory rules (under RBI directives and DPDP Act provisions) mandating that sensitive financial and payment records of domestic citizens be stored and processed exclusively within domestic physical borders.

synthetic-identity-fraud:
  term: Synthetic identity fraud
  def: A sophisticated financial crime where genuine (often stolen) credentials like PAN or Aadhaar are combined with fictitious personal data to create new credit identities that build credit before defaulting.

predictive-maintenance:
  term: Predictive maintenance (PdM)
  def: A condition-based maintenance strategy using continuous sensor telemetry, frequency spectrum analysis, and machine learning to forecast equipment degradation and schedule repairs before functional downtime occurs.

overall-equipment-effectiveness:
  term: Overall equipment effectiveness (OEE)
  def: The benchmark manufacturing productivity metric measuring the product of equipment availability, operational performance speed, and output quality rate (OEE = Availability × Performance × Quality).

remaining-useful-life:
  term: Remaining useful life (RUL)
  def: The estimated operational operating time or cycles remaining before an industrial asset, component, or mechanical bearing fails or degrades below certified operating tolerances.

weibull-hazard-rate:
  term: Weibull hazard modeling
  def: A survival analysis distribution modeling physical asset failure probability over time, where shape parameter β distinguishes infant mortality (β < 1), random operational failures (β = 1), and mechanical wear-out (β > 1).

digital-twin:
  term: Digital twin
  def: A dynamic, bidirectional software representation of a physical machine or industrial process synchronized continuously via telemetry to simulate operational states, predict faults, and optimize operating setpoints.

bullwhip-effect:
  term: Bullwhip effect
  def: The progressive amplification of demand variability upstream in a multi-echelon supply chain caused by batch ordering, transmission lags, price promotions, and shortage gaming.

demand-sensing:
  term: Demand sensing
  def: High-frequency probabilistic forecasting that ingests near-real-time downstream signals (daily point-of-sale data, hyper-local weather, search queries, channel footfalls) to compress short-horizon inventory uncertainty.

multi-echelon-inventory-optimization:
  term: Multi-echelon inventory optimization (MEIO)
  def: A mathematical approach that optimizes safety stock placement holistically across all levels of a distribution network (mother plants, central warehouses, regional hubs, dark stores) rather than buffering each stage in isolation.

autonomous-mobile-robot:
  term: Autonomous mobile robot (AMR)
  def: An industrial logistics vehicle that uses onboard LiDAR, computer vision, and simultaneous localization and mapping (SLAM) algorithms to navigate dynamic warehouse floors autonomously without fixed physical magnetic tracks.

dark-store:
  term: Dark store
  def: A compact, hyper-local micro-fulfillment center situated inside dense urban residential catchments, optimized exclusively for algorithmic goods-to-person picking and sub-15-minute quick-commerce order dispatch.

automated-optical-inspection:
  term: Automated optical inspection (AOI)
  def: High-speed computer vision systems paired with edge deep learning classifiers that inspect components on high-throughput assembly lines, detecting surface defects, soldering anomalies, and dimensional deviations in real time.

inspection-error-tradeoff:
  term: False rejection vs escape rate
  def: The fundamental operational trade-off in automated inspection between Type I error (false alarms that needlessly scrap conforming parts) and Type II error (escaped defective units that reach customers, triggering recalls and brand liability).
