<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dual-Core Algorithmic Credit Underwriting Architecture showing classical risk core, unstructured document radar, central XAI SHAP attribution, and three-tier decision channels.">
  <!-- Title & Principle Header -->
  <text class="t-display" x="20" y="24" font-size="15">Dual-Core Algorithmic Credit Underwriting Architecture</text>
  <text x="20" y="38" font-size="8.5" fill="#666">Decoupling Basel-compliant deterministic risk scoring from multi-modal unstructured document intelligence</text>

  <!-- Top Left: Core A - Structured Classical Risk Core -->
  <rect class="paper acc-s" x="20" y="46" width="290" height="94" rx="4" stroke-width="1.5"/>
  <text class="t-display" x="32" y="64" font-size="11">Core A: Structured Classical Risk Engine</text>
  <text x="32" y="77" font-size="8" font-weight="bold">Inputs: CIBIL bureaus, repayment ledgers, DTI ratios</text>
  <text x="32" y="89" font-size="8">• Monotonic GBDT, XGBoost, Weight of Evidence (WoE)</text>
  <text x="32" y="101" font-size="8">• Basel III/IV IRB: deterministic PD &amp; LGD</text>
  <text x="32" y="113" font-size="8">• Monotonicity &amp; regulatory capital rules</text>
  <text x="32" y="126" font-size="7.5" fill="#666">Auditable loss distribution &amp; provisioning</text>

  <!-- Top Right: Core B - Unstructured Document Radar -->
  <rect class="paper acc-s" x="330" y="46" width="290" height="94" rx="4" stroke-width="1.5"/>
  <text class="t-display" x="342" y="64" font-size="11">Core B: Unstructured Document Intelligence</text>
  <text x="342" y="77" font-size="8" font-weight="bold">Inputs: GSTN GSTR-2B, 12M PDFs, MCA filings, e-way</text>
  <text x="342" y="89" font-size="8">• LayoutLM, cross-entity reconciliation, graphs</text>
  <text x="342" y="101" font-size="8">• Radar: Circular invoices, turnover fraud, litigation</text>
  <text x="342" y="113" font-size="8">• Feature Emission: Calibrated verification flags</text>
  <text x="342" y="126" font-size="7.5" fill="#666">High-dimensional feature extraction feeds Core A</text>

  <!-- Arrows from Cores to Central Synthesis -->
  <path d="M 165 140 L 165 152 M 161 148 L 165 153 L 169 148" stroke="currentColor" fill="none" stroke-width="1.4"/>
  <path d="M 475 140 L 475 152 M 471 148 L 475 153 L 479 148" stroke="currentColor" fill="none" stroke-width="1.4"/>

  <!-- Middle: Central Synthesis, XAI & Governance Layer -->
  <rect class="wash acc-s" x="20" y="154" width="600" height="68" rx="4" stroke-width="2"/>
  <text class="t-display" x="32" y="172" font-size="12">Central Synthesis, XAI &amp; Regulatory Governance Layer</text>

  <text x="32" y="188" font-size="9" font-weight="bold">SHAP / TreeSHAP Attribution</text>
  <text x="32" y="200" font-size="8.5">Calculates exact marginal feature</text>
  <text x="32" y="211" font-size="8.5">contributions (phi) across inputs</text>

  <text x="235" y="188" font-size="9" font-weight="bold">Statutory Adverse Action Engine</text>
  <text x="235" y="200" font-size="8.5">RBI FREE-AI &amp; ECOA compliance</text>
  <text x="235" y="211" font-size="8.5">Maps negative SHAP to borrower codes</text>

  <text x="445" y="188" font-size="9" font-weight="bold">Underwriter Cockpit &amp; Audit Trail</text>
  <text x="445" y="200" font-size="8.5">Unified discrepancy radar HUD</text>
  <text x="445" y="211" font-size="8">Audit trail of all human overrides</text>

  <!-- Arrows from Central Synthesis to Decision Channels -->
  <path d="M 115 222 L 115 238 M 111 234 L 115 239 L 119 234" stroke="currentColor" fill="none" stroke-width="1.4"/>
  <path d="M 320 222 L 320 238 M 316 234 L 320 239 L 324 234" stroke="currentColor" fill="none" stroke-width="1.4"/>
  <path d="M 525 222 L 525 238 M 521 234 L 525 239 L 529 234" stroke="currentColor" fill="none" stroke-width="1.4"/>

  <!-- Bottom: 3 Output Decision Channels -->
  <!-- Channel 1: Straight-Through Approve -->
  <rect class="paper acc-s" x="20" y="240" width="190" height="76" rx="4" stroke-width="1.2"/>
  <text x="30" y="256" font-size="10.5" font-weight="bold" fill="#0B7A5C">Tier 1: Straight-Through Approve</text>
  <text x="30" y="270" font-size="8.5">• PD &lt; 0.8% · Prime credit score</text>
  <text x="30" y="282" font-size="8.5">• Zero doc anomalies or GST gaps</text>
  <text x="30" y="294" font-size="8.5" font-weight="bold">Decision: Automated Instant Sanction</text>
  <text x="30" y="306" font-size="8" fill="#666">Disbursement within 3 minutes (STP)</text>

  <!-- Channel 2: Credit Committee Review -->
  <rect class="wash acc-s" x="225" y="240" width="190" height="76" rx="4" stroke-width="1.8"/>
  <text class="t-display" x="235" y="256" font-size="10.5" fill="#2337E6">Tier 2: Credit Committee Review</text>
  <text x="235" y="270" font-size="8.5">• PD 0.8%–2.5% or Exposure &gt; ₹25 Lakh</text>
  <text x="235" y="282" font-size="8.5">• Flagged bank statement / GST skew</text>
  <text x="235" y="294" font-size="8.5" font-weight="bold">Decision: Human Underwriter HUD</text>
  <text x="235" y="306" font-size="8" fill="#666">Dual sign-off on collateral &amp; covenants</text>

  <!-- Channel 3: Adverse Action Decline -->
  <rect class="paper acc-s" x="430" y="240" width="190" height="76" rx="4" stroke-width="1.2"/>
  <text x="440" y="256" font-size="10.5" font-weight="bold" fill="#B83A26">Tier 3: Adverse Action Decline</text>
  <text x="440" y="270" font-size="8">• PD &gt; 2.5% or severe legal risks</text>
  <text x="440" y="282" font-size="8">• Debt overburden / default flag</text>
  <text x="440" y="294" font-size="8" font-weight="bold">Decision: Decline + Notice</text>
  <text x="440" y="306" font-size="7.5" fill="#666">Top 4 SHAP reason codes communicated</text>
</svg>
