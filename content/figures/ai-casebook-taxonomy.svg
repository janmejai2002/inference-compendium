<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The AI case interview taxonomy: The four problem archetypes on the left, and the token-to-infrastructure sizing tree on the right.">
  <text class="t-display" x="20" y="26" font-size="15">Four AI Case Archetypes</text>
  <text class="t-display" x="350" y="26" font-size="15">The Token-to-Compute Sizing Tree</text>

  <!-- Left: 4 Case Archetypes -->
  <rect class="paper acc-s" x="20" y="42" width="300" height="46" rx="4" stroke-width="1.5"/>
  <text x="32" y="60" font-size="10.5" font-weight="bold">1. Due Diligence &amp; M&amp;A</text>
  <text x="32" y="76" font-size="9">Wrapper vs. defensible IP, real containment vs. rework</text>

  <rect class="paper acc-s" x="20" y="94" width="300" height="46" rx="4" stroke-width="1.5"/>
  <text x="32" y="112" font-size="10.5" font-weight="bold">2. Use-Case Mapping &amp; Prioritization</text>
  <text x="32" y="128" font-size="9">Text vs. numbers (GenAI vs. Classic ML), regulatory gates</text>

  <rect class="paper acc-s" x="20" y="146" width="300" height="46" rx="4" stroke-width="1.5"/>
  <text x="32" y="164" font-size="10.5" font-weight="bold">3. Pilot Diagnostics &amp; Change</text>
  <text x="32" y="180" font-size="9">Workflow redesign, capacity leakage, approval bottlenecks</text>

  <rect class="paper acc-s" x="20" y="198" width="300" height="46" rx="4" stroke-width="1.5"/>
  <text x="32" y="216" font-size="10.5" font-weight="bold">4. Unit Economics &amp; Pricing</text>
  <text x="32" y="232" font-size="9">Inference cost per query, token billing, outcome fees</text>

  <!-- Divider -->
  <line class="rule-s" x1="335" x2="335" y1="20" y2="255" stroke-width="1"/>

  <!-- Right: Token & Compute Sizing Funnel -->
  <rect class="paper acc-s" x="350" y="42" width="270" height="60" rx="4" stroke-width="1.5"/>
  <text x="362" y="62" font-size="11" font-weight="bold">Step 1: User &amp; Query Funnel</text>
  <text x="362" y="78" font-size="9.5">Target Population &#8594; Active Users &#8594; Queries/Day</text>
  <text x="362" y="92" font-size="8.5" fill="#555">Anchor on TRAI subscriber data (1,348M telecom)</text>

  <rect class="paper acc-s" x="350" y="112" width="270" height="60" rx="4" stroke-width="1.5"/>
  <text x="362" y="132" font-size="11" font-weight="bold">Step 2: Token Volume Decomposition</text>
  <text x="362" y="148" font-size="9.5">Input Tokens (Context, RAG) + Output Tokens</text>
  <text x="362" y="162" font-size="8.5" fill="#555">Model context caching vs. raw API token generation</text>

  <rect class="wash acc-s" x="350" y="182" width="270" height="62" rx="4" stroke-width="2"/>
  <text class="t-display" x="362" y="202" font-size="11.5">Step 3: Compute &amp; Power Translation</text>
  <text x="362" y="218" font-size="9.5">API Bill vs. GPU-Hours (&#8377;65/hr IndiaAI subsidized)</text>
  <text x="362" y="232" font-size="8.5" fill="#555">Data centre MW capacity (1,789 MW operational India)</text>
</svg>