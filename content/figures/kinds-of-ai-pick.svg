<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decision map: start from the output you need. Logic you can write down leads to rules; a checkable number, category or probability leads to a predictive model; new content with many right answers leads to a generative model."><rect class="wash" x="170" y="8" width="300" height="44" rx="4"/><text class="t-display" x="320" y="36" text-anchor="middle" font-size="16">What must the output be?</text><path class="ink-s" d="M320 52 V70 M110 70 H530 M110 70 V90 M320 70 V90 M530 70 V90" fill="none" stroke-width="1.5"/><rect class="paper rule-s" x="15" y="90" width="190" height="56" stroke-width="1"/><text x="110" y="113" text-anchor="middle" font-size="11">A fixed decision from</text><text x="110" y="131" text-anchor="middle" font-size="11">logic you can write down</text><rect class="paper rule-s" x="225" y="90" width="190" height="56" stroke-width="1"/><text x="320" y="113" text-anchor="middle" font-size="11">A number, category or</text><text x="320" y="131" text-anchor="middle" font-size="11">probability you can check</text><rect class="paper rule-s" x="435" y="90" width="190" height="56" stroke-width="1"/><text x="530" y="113" text-anchor="middle" font-size="11">New content: text, image,</text><text x="530" y="131" text-anchor="middle" font-size="11">code. Many right answers.</text><path class="ink-s" d="M110 146 V170 M320 146 V170 M530 146 V170" fill="none" stroke-width="1.5"/><path class="ink" d="M104 164 L110 172 L116 164 Z M314 164 L320 172 L326 164 Z M524 164 L530 172 L536 164 Z"/><rect class="paper ink-s" x="15" y="174" width="190" height="42" stroke-width="2"/><text class="t-display" x="110" y="201" text-anchor="middle" font-size="16">Rules</text><rect class="paper acc-s" x="225" y="174" width="190" height="42" stroke-width="2.5"/><text class="t-display" x="320" y="201" text-anchor="middle" font-size="16">Predictive model</text><rect class="paper ink-s" x="435" y="174" width="190" height="42" stroke-width="2"/><text class="t-display" x="530" y="201" text-anchor="middle" font-size="16">Generative model</text><line class="rule-s" x1="15" x2="625" y1="236" y2="236" stroke-width="1"/><text x="110" y="258" text-anchor="middle" font-size="11">In: your know-how</text><text x="320" y="258" text-anchor="middle" font-size="11">In: labelled history</text><text x="530" y="258" text-anchor="middle" font-size="11">In: prompt + documents</text><text x="110" y="278" text-anchor="middle" font-size="11">Check: audit the logic</text><text x="320" y="278" text-anchor="middle" font-size="11">Check: forecast vs actual</text><text x="530" y="278" text-anchor="middle" font-size="11">Check: a person judges</text><line class="rule-s" x1="15" x2="625" y1="292" y2="292" stroke-width="1"/><text x="110" y="310" text-anchor="middle" font-size="11">e.g. KYC document list</text><text x="320" y="310" text-anchor="middle" font-size="11">e.g. will this loan default?</text><text x="530" y="310" text-anchor="middle" font-size="11">e.g. draft the reply email</text></svg>
