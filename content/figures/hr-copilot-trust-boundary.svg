<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Enterprise HR Copilot Trust Boundary showing the three operational zones: Autonomous resolution, Human-supervised augmentation, and Strictly forbidden human escalation.">
  <!-- Title & Subtitle -->
  <text class="t-display" x="20" y="24" font-size="15">The HR Copilot Trust Boundary &amp; Governance Architecture</text>
  <text x="20" y="38" font-size="8.5" fill="#666">Deflection boundaries, supervised augmentation, and statutory non-automation limits</text>

  <!-- Left Column: The 3 Operational Trust Zones -->
  <!-- Zone 1: Green / Autonomous Zone -->
  <rect class="paper acc-s" x="20" y="48" width="300" height="78" rx="4" stroke-width="1.5"/>
  <text class="t-display" x="32" y="66" font-size="11" fill="#0B7A5C">1. Autonomous Zone (Full Deflection)</text>
  <text x="32" y="80" font-size="8" font-weight="bold">Action: Grounded RAG directly answers employee</text>
  <text x="32" y="93" font-size="8">• Annual leave balances &amp; holiday calendar lookups</text>
  <text x="32" y="105" font-size="8">• Medical insurance coverage &amp; claim submission SOPs</text>
  <text x="32" y="117" font-size="7.5" fill="#666">Metric: First-contact resolution (Target: 60-70%)</text>

  <!-- Arrow Down -->
  <path d="M 170 126 L 170 138 M 166 134 L 170 139 L 174 134" stroke="currentColor" fill="none" stroke-width="1.4"/>

  <!-- Zone 2: Amber / Supervised Augmentation Zone -->
  <rect class="wash acc-s" x="20" y="140" width="300" height="80" rx="4" stroke-width="1.8"/>
  <text class="t-display" x="32" y="158" font-size="11" fill="#D9720B">2. Supervised Zone (Copilot Drafting)</text>
  <text x="32" y="172" font-size="8" font-weight="bold">Action: Model drafts synthesis; HR specialist reviews</text>
  <text x="32" y="185" font-size="8">• Performance appraisal milestone summarization</text>
  <text x="32" y="197" font-size="8">• Cross-functional internal transfer requests</text>
  <text x="32" y="209" font-size="7.5" fill="#666">Constraint: Human sign-off required prior to release</text>

  <!-- Arrow Down -->
  <path d="M 170 220 L 170 232 M 166 228 L 170 233 L 174 228" stroke="currentColor" fill="none" stroke-width="1.4"/>

  <!-- Zone 3: Red / Strictly Forbidden Zone -->
  <rect class="paper acc-s" x="20" y="234" width="300" height="82" rx="4" stroke-width="1.5"/>
  <text class="t-display" x="32" y="252" font-size="11" fill="#B83A26">3. Forbidden Zone (Immediate Human Hand-off)</text>
  <text x="32" y="266" font-size="8" font-weight="bold">Zero AI Generation: Instant secure escalation</text>
  <text x="32" y="279" font-size="8">• Harassment, POSH, discrimination complaints</text>
  <text x="32" y="291" font-size="8">• Mental health crises &amp; bereavement emergencies</text>
  <text x="32" y="303" font-size="8">• Disciplinary hearings &amp; termination notices</text>

  <!-- Divider -->
  <line class="rule-s" x1="335" y1="48" x2="335" y2="316" stroke-width="1"/>

  <!-- Right Column: Governance, Metrics & Law (x >= 350, max chars < 45) -->
  <!-- Box 1: The Deflection Gaming Trap -->
  <rect class="wash acc-s" x="350" y="48" width="270" height="126" rx="4" stroke-width="2"/>
  <text class="t-display" x="362" y="66" font-size="11">The Deflection Gaming Trap</text>
  <text x="362" y="81" font-size="8" font-weight="bold">Deflection = Closed without agent</text>
  <text x="362" y="94" font-size="8">• Bad metric: High deflection via user</text>
  <text x="372" y="106" font-size="8">exhaustion and buried escalation links</text>
  <text x="362" y="120" font-size="8" font-weight="bold" fill="#0B7A5C">The True Trust Index:</text>
  <text x="362" y="133" font-size="8">• Real First-Contact Resolution</text>
  <text x="362" y="146" font-size="8">• Unforced human escalation rate</text>
  <text x="362" y="159" font-size="7.5" fill="#666">Avoids employee disillusionment</text>

  <!-- Box 2: Statutory Compliance Boundaries -->
  <rect class="paper acc-s" x="350" y="184" width="270" height="132" rx="4" stroke-width="1.5"/>
  <text class="t-display" x="362" y="202" font-size="11">Statutory Compliance Boundaries</text>
  <text x="362" y="217" font-size="8" font-weight="bold" fill="#B83A26">EU AI Act (Art. 5(1)(f)):</text>
  <text x="362" y="230" font-size="8">• Emotion recognition banned at work</text>
  <text x="362" y="244" font-size="8" font-weight="bold">DPDP Act 2023 (Section 7(i)):</text>
  <text x="362" y="257" font-size="8">• Legitimate use strictly for employment</text>
  <text x="362" y="269" font-size="8">• Minimization: No keystroke telemetry</text>
  <text x="362" y="283" font-size="8" font-weight="bold">Works Councils (Betriebsrat):</text>
  <text x="362" y="296" font-size="8">• Co-determination for employee data</text>
  <text x="362" y="307" font-size="7.5" fill="#666">Global rollouts require worker sign-off</text>
</svg>
