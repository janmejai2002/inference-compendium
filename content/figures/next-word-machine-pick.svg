<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bar chart of next-token probabilities after the words 'the RBI kept the repo rate', with 'unchanged' most likely, then a loop arrow: pick one, append, ask again"><text x="24" y="30" font-size="11">THE TEXT SO FAR</text><text class="t-display" x="24" y="56" font-size="17">"Despite sticky inflation, the RBI kept the repo rate …"</text><line class="rule-s" x1="24" x2="616" y1="74" y2="74" stroke-width="1"/><text x="24" y="96" font-size="11">CANDIDATE NEXT TOKEN</text><text x="200" y="96" font-size="11">PROBABILITY THE MODEL GIVES IT</text><text x="180" y="124" text-anchor="end" font-size="13">unchanged</text><rect class="acc" x="200" y="110" width="329" height="20"/><text x="537" y="125" font-size="12">0.52</text><text x="180" y="156" text-anchor="end" font-size="13">steady</text><rect class="wash" x="200" y="142" width="114" height="20"/><rect class="ink-s" x="200" y="142" width="114" height="20" fill="none" stroke-width="1"/><text x="322" y="157" font-size="12">0.18</text><text x="180" y="188" text-anchor="end" font-size="13">at</text><rect class="wash" x="200" y="174" width="89" height="20"/><rect class="ink-s" x="200" y="174" width="89" height="20" fill="none" stroke-width="1"/><text x="297" y="189" font-size="12">0.14</text><text x="180" y="220" text-anchor="end" font-size="13">on</text><rect class="wash" x="200" y="206" width="38" height="20"/><rect class="ink-s" x="200" y="206" width="38" height="20" fill="none" stroke-width="1"/><text x="246" y="221" font-size="12">0.06</text><text x="180" y="252" text-anchor="end" font-size="13">… every other token</text><rect class="wash" x="200" y="238" width="64" height="20"/><rect class="ink-s" x="200" y="238" width="64" height="20" fill="none" stroke-width="1"/><text x="272" y="253" font-size="12">0.10 in total</text><line class="rule-s" x1="24" x2="616" y1="272" y2="272" stroke-width="1"/><text class="t-display" x="24" y="293" font-size="14">Pick one (usually, not always, the top)  →  append it  →  ask again</text></svg>
