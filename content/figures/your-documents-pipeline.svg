<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two-row diagram of retrieval-augmented generation. Ahead of time: documents are cut into chunks, each chunk is turned into an embedding, and the embeddings are stored in an index. For every question: the index is searched for the closest chunks, the prompt is built from an instruction, those chunks and the question, and the model writes an answer that cites them. Four numbered markers show where it breaks: old or missing file, chunk loses its context, right passage not retrieved, model misreads what it got."><text x="24" y="26" font-size="11">AHEAD OF TIME (AND AGAIN WHENEVER FILES CHANGE)</text><rect class="wash" x="24" y="38" width="136" height="54"/><rect class="ink-s" x="24" y="38" width="136" height="54" fill="none" stroke-width="1"/><text x="92" y="61" text-anchor="middle" font-size="13" class="t-display">Your documents</text><text x="92" y="79" text-anchor="middle" font-size="11">decks, PDFs, policies</text><rect class="wash" x="176" y="38" width="136" height="54"/><rect class="ink-s" x="176" y="38" width="136" height="54" fill="none" stroke-width="1"/><text x="244" y="61" text-anchor="middle" font-size="13" class="t-display">Cut into chunks</text><text x="244" y="79" text-anchor="middle" font-size="11">a paragraph each</text><rect class="wash" x="328" y="38" width="136" height="54"/><rect class="ink-s" x="328" y="38" width="136" height="54" fill="none" stroke-width="1"/><text x="396" y="61" text-anchor="middle" font-size="13" class="t-display">Embed each chunk</text><text x="396" y="79" text-anchor="middle" font-size="11">meaning as numbers</text><rect class="wash" x="480" y="38" width="136" height="54"/><rect class="ink-s" x="480" y="38" width="136" height="54" fill="none" stroke-width="1"/><text x="548" y="61" text-anchor="middle" font-size="13" class="t-display">Index</text><text x="548" y="79" text-anchor="middle" font-size="11">searchable store</text><line class="ink-s" x1="162" y1="65" x2="170" y2="65" stroke-width="1.5"/><polygon class="ink" points="174,65 168,61 168,69"/><line class="ink-s" x1="314" y1="65" x2="322" y2="65" stroke-width="1.5"/><polygon class="ink" points="326,65 320,61 320,69"/><line class="ink-s" x1="466" y1="65" x2="474" y2="65" stroke-width="1.5"/><polygon class="ink" points="478,65 472,61 472,69"/><polyline class="ink-s" points="548,94 548,140 244,140 244,186" fill="none" stroke-width="1.5" stroke-dasharray="4 3"/><polygon class="ink" points="244,190 240,184 248,184"/><text x="396" y="134" text-anchor="middle" font-size="11">searched at question time</text><text x="24" y="176" font-size="11">EVERY QUESTION</text><rect class="wash" x="24" y="192" width="136" height="54"/><rect class="ink-s" x="24" y="192" width="136" height="54" fill="none" stroke-width="1"/><text x="92" y="215" text-anchor="middle" font-size="13" class="t-display">Question</text><text x="92" y="233" text-anchor="middle" font-size="11">embedded the same way</text><rect class="wash" x="176" y="192" width="136" height="54"/><rect class="ink-s" x="176" y="192" width="136" height="54" fill="none" stroke-width="1"/><text x="244" y="215" text-anchor="middle" font-size="13" class="t-display">Retrieve</text><text x="244" y="233" text-anchor="middle" font-size="11">closest few chunks</text><rect class="wash" x="328" y="192" width="136" height="54"/><rect class="ink-s" x="328" y="192" width="136" height="54" fill="none" stroke-width="1"/><text x="396" y="211" text-anchor="middle" font-size="13" class="t-display">Build the prompt</text><text x="396" y="227" text-anchor="middle" font-size="11">instruction + chunks</text><text x="396" y="240" text-anchor="middle" font-size="11">+ question</text><rect class="acc" x="480" y="192" width="136" height="54"/><text x="548" y="215" text-anchor="middle" font-size="13" class="t-display paper">Model answers</text><text x="548" y="233" text-anchor="middle" font-size="11" class="paper">and cites the chunks</text><line class="ink-s" x1="162" y1="219" x2="170" y2="219" stroke-width="1.5"/><polygon class="ink" points="174,219 168,215 168,223"/><line class="ink-s" x1="314" y1="219" x2="322" y2="219" stroke-width="1.5"/><polygon class="ink" points="326,219 320,215 320,223"/><line class="ink-s" x1="466" y1="219" x2="474" y2="219" stroke-width="1.5"/><polygon class="ink" points="478,219 472,215 472,223"/><circle class="mk" cx="24" cy="38" r="10"/><circle class="ink-s" cx="24" cy="38" r="10" fill="none" stroke-width="1"/><text x="24" y="42" text-anchor="middle" font-size="11">1</text><circle class="mk" cx="176" cy="38" r="10"/><circle class="ink-s" cx="176" cy="38" r="10" fill="none" stroke-width="1"/><text x="176" y="42" text-anchor="middle" font-size="11">2</text><circle class="mk" cx="176" cy="192" r="10"/><circle class="ink-s" cx="176" cy="192" r="10" fill="none" stroke-width="1"/><text x="176" y="196" text-anchor="middle" font-size="11">3</text><circle class="mk" cx="480" cy="192" r="10"/><circle class="ink-s" cx="480" cy="192" r="10" fill="none" stroke-width="1"/><text x="480" y="196" text-anchor="middle" font-size="11">4</text><line class="rule-s" x1="24" x2="616" y1="268" y2="268" stroke-width="1"/><text x="24" y="288" font-size="11">WHERE IT BREAKS  1 old, superseded or missing file   2 chunk loses its title and date</text><text x="24" y="306" font-size="11">3 the right passage is not among those retrieved   4 the model misreads what it was given</text></svg>
