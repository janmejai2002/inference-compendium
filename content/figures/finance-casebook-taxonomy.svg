<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The quantitative finance and risk taxonomy: The four strategic corporate finance cases on the left, and the four quantitative sizing models on the right.">
  <text class="t-display" x="20" y="26" font-size="15">Four Strategic Corporate Finance Cases</text>
  <text class="t-display" x="350" y="26" font-size="15">Four Quantitative Sizing Models</text>

  <!-- Left: 4 Strategic Cases -->
  <rect class="paper acc-s" x="20" y="42" width="300" height="46" rx="4" stroke-width="1.5"/>
  <text x="32" y="60" font-size="10.5" font-weight="bold">1. Commercial SME Lending Underwriting ROI</text>
  <text x="32" y="76" font-size="9">GSTN &amp; bank statement parsing, cash-flow scoring, Basel III/IV IRB</text>

  <rect class="paper acc-s" x="20" y="94" width="300" height="46" rx="4" stroke-width="1.5"/>
  <text x="32" y="112" font-size="10.5" font-weight="bold">2. Private Equity M&amp;A Due Diligence</text>
  <text x="32" y="128" font-size="9">12,000 VDR contracts, cell-level audit lineage, EBITDA adjustments</text>

  <rect class="paper acc-s" x="20" y="146" width="300" height="46" rx="4" stroke-width="1.5"/>
  <text x="32" y="164" font-size="10.5" font-weight="bold">3. Retail Wealth Management Robo-Advisory</text>
  <text x="32" y="180" font-size="9">Hybrid advisory economics, advisor capacity 5x, AUM retention</text>

  <rect class="paper acc-s" x="20" y="198" width="300" height="46" rx="4" stroke-width="1.5"/>
  <text x="32" y="216" font-size="10.5" font-weight="bold">4. Fraud &amp; AML Operations Optimization</text>
  <text x="32" y="232" font-size="9">Two-stage GNN &amp; LLM cascade, false-positive triage, RBI FREE-AI</text>

  <!-- Divider -->
  <line class="rule-s" x1="335" x2="335" y1="20" y2="255" stroke-width="1"/>

  <!-- Right: 4 Quantitative Sizing Models -->
  <rect class="paper acc-s" x="350" y="42" width="270" height="46" rx="4" stroke-width="1.5"/>
  <text x="362" y="60" font-size="10.5" font-weight="bold">Guesstimate 1: Private AI Cluster TCO</text>
  <text x="362" y="76" font-size="9">3-year TCO: On-premise HGX H100 vs. cloud APIs, DPDP localization</text>

  <rect class="paper acc-s" x="350" y="94" width="270" height="46" rx="4" stroke-width="1.5"/>
  <text x="362" y="112" font-size="10.5" font-weight="bold">Guesstimate 2: Debt Covenant Surveillance</text>
  <text x="362" y="128" font-size="9">Streaming debt telemetry, IBC early warning signals, EWS alerts</text>

  <rect class="paper acc-s" x="350" y="146" width="270" height="46" rx="4" stroke-width="1.5"/>
  <text x="362" y="164" font-size="10.5" font-weight="bold">Guesstimate 3: NBFC Valuation Rerating</text>
  <text x="362" y="180" font-size="9">Cost-to-income compression, DuPont ROE decomposition, P/B gain</text>

  <rect class="wash acc-s" x="350" y="198" width="270" height="46" rx="4" stroke-width="2"/>
  <text class="t-display" x="362" y="216" font-size="10.5">Guesstimate 4: Algo Trading Liquidity Buffers</text>
  <text x="362" y="232" font-size="9">Multi-agent flash crashes, SEBI algo guidelines, VaR 99%</text>
</svg>
