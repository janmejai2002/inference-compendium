<svg viewBox="0 0 640 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The HR and People AI Casebook Taxonomy: Four strategic HR cases on the left, and four quantitative estimation models on the right.">
  <text class="t-display" x="20" y="26" font-size="15">Four Strategic HR Cases</text>
  <text class="t-display" x="350" y="26" font-size="15">Four Quantitative Sizing Models</text>

  <!-- Left: 4 Strategic Cases -->
  <rect class="paper acc-s" x="20" y="42" width="300" height="46" rx="4" stroke-width="1.5"/>
  <text x="32" y="60" font-size="10.5" font-weight="bold">1. Campus Screening &amp; Bias Audit</text>
  <text x="32" y="75" font-size="8">120k campus CVs, AIR 4/5ths rule, NYC LL144</text>

  <rect class="paper acc-s" x="20" y="94" width="300" height="46" rx="4" stroke-width="1.5"/>
  <text x="32" y="112" font-size="10.5" font-weight="bold">2. BPO Reskilling vs. Redeployment</text>
  <text x="32" y="127" font-size="8">15k seats, 40% deflection, Net Economic Benefit</text>

  <rect class="paper acc-s" x="20" y="146" width="300" height="46" rx="4" stroke-width="1.5"/>
  <text x="32" y="164" font-size="10.5" font-weight="bold">3. HR Copilot Go-Live &amp; Incident</text>
  <text x="32" y="179" font-size="8">40k staff, escalation boundaries, POSH crisis</text>

  <rect class="paper acc-s" x="20" y="198" width="300" height="46" rx="4" stroke-width="1.5"/>
  <text x="32" y="216" font-size="10.5" font-weight="bold">4. Retail Store Attrition Model</text>
  <text x="32" y="231" font-size="8">25k associates, flight risk, surveillance refusal</text>

  <!-- Divider -->
  <line class="rule-s" x1="335" x2="335" y1="20" y2="255" stroke-width="1"/>

  <!-- Right: 4 Quantitative Sizing Models (x >= 350, max chars < 45) -->
  <rect class="paper acc-s" x="350" y="42" width="270" height="46" rx="4" stroke-width="1.5"/>
  <text x="362" y="60" font-size="10.5" font-weight="bold">Guesstimate 1: Recruiter Hours Saved</text>
  <text x="362" y="75" font-size="8">50k applicants, screening triage vs full read</text>

  <rect class="paper acc-s" x="350" y="94" width="270" height="46" rx="4" stroke-width="1.5"/>
  <text x="362" y="112" font-size="10.5" font-weight="bold">Guesstimate 2: Reskilling vs Severance</text>
  <text x="362" y="127" font-size="8">4-month severance vs 14-week academy TCO</text>

  <rect class="paper acc-s" x="350" y="146" width="270" height="46" rx="4" stroke-width="1.5"/>
  <text x="362" y="164" font-size="10.5" font-weight="bold">Guesstimate 3: Enterprise Ticket Sizing</text>
  <text x="362" y="179" font-size="8">50k staff, inquiry seasonality, deflection pool</text>

  <rect class="wash acc-s" x="350" y="198" width="270" height="46" rx="4" stroke-width="2"/>
  <text class="t-display" x="362" y="216" font-size="10.5">Guesstimate 4: Fraud Detection TCO</text>
  <text x="362" y="231" font-size="8">5k hires, proctoring &amp; oral defense economics</text>
</svg>
