<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Left: the six parts of a delegation brief (goal and why, audience, context, one example, output format, flag your doubts) feeding a review-and-revise loop. Right: prompt folklore that controlled tests did not support on average: tips and threats, please versus I order, and think step by step on reasoning models."><text class="t-display" x="20" y="28" font-size="16">The brief: what all three labs ask for</text><text class="t-display" x="410" y="28" font-size="16">Folklore</text><rect class="paper acc-s" x="20" y="42" width="170" height="40" stroke-width="2"/><text x="105" y="60" text-anchor="middle" font-size="11">1 Goal, and why</text><text x="105" y="74" text-anchor="middle" font-size="10">what the output is for</text><rect class="paper acc-s" x="200" y="42" width="170" height="40" stroke-width="2"/><text x="285" y="60" text-anchor="middle" font-size="11">2 Audience</text><text x="285" y="74" text-anchor="middle" font-size="10">who reads it, what they know</text><rect class="paper acc-s" x="20" y="92" width="170" height="40" stroke-width="2"/><text x="105" y="110" text-anchor="middle" font-size="11">3 Context, pasted in</text><text x="105" y="124" text-anchor="middle" font-size="10">data, notes, constraints</text><rect class="paper acc-s" x="200" y="92" width="170" height="40" stroke-width="2"/><text x="285" y="110" text-anchor="middle" font-size="11">4 One example</text><text x="285" y="124" text-anchor="middle" font-size="10">what good looks like</text><rect class="paper acc-s" x="20" y="142" width="170" height="40" stroke-width="2"/><text x="105" y="160" text-anchor="middle" font-size="11">5 Output format</text><text x="105" y="174" text-anchor="middle" font-size="10">table, length, columns</text><rect class="paper acc-s" x="200" y="142" width="170" height="40" stroke-width="2"/><text x="285" y="160" text-anchor="middle" font-size="11">6 Flag your doubts</text><text x="285" y="174" text-anchor="middle" font-size="10">mark what is unsure</text><path class="ink-s" d="M195 182 V206" fill="none" stroke-width="1.5"/><path class="ink" d="M189 200 L195 208 L201 200 Z"/><rect class="wash" x="20" y="210" width="350" height="44" rx="4"/><text class="t-display" x="195" y="237" text-anchor="middle" font-size="14">Read the output, then revise the brief</text><path class="ink-s" d="M20 232 H8 V62 H14" fill="none" stroke-width="1"/><path class="ink" d="M14 56 L22 62 L14 68 Z"/><line class="rule-s" x1="395" x2="395" y1="14" y2="300" stroke-width="1"/><rect class="paper rule-s" x="410" y="42" width="215" height="56" stroke-width="1"/><text x="517" y="62" text-anchor="middle" font-size="11">Tips ($1,000 to $1 trillion)</text><text x="517" y="78" text-anchor="middle" font-size="11">and threats</text><text x="517" y="92" text-anchor="middle" font-size="10">Report 3: no average gain</text><rect class="paper rule-s" x="410" y="108" width="215" height="56" stroke-width="1"/><text x="517" y="128" text-anchor="middle" font-size="11">"Please" versus "I order"</text><text x="517" y="144" text-anchor="middle" font-size="10">Report 1: washes out</text><text x="517" y="158" text-anchor="middle" font-size="10">when averaged</text><rect class="paper rule-s" x="410" y="174" width="215" height="56" stroke-width="1"/><text x="517" y="194" text-anchor="middle" font-size="11">"Think step by step"</text><text x="517" y="210" text-anchor="middle" font-size="10">Report 2: marginal on reasoning</text><text x="517" y="224" text-anchor="middle" font-size="10">models, costs time and tokens</text><line class="rule-s" x1="20" x2="625" y1="276" y2="276" stroke-width="1"/><text x="20" y="298" font-size="11">Left: the same checklist appears in Anthropic, OpenAI and Google guides.</text><text x="20" y="316" font-size="11">Right: Wharton Prompting Science Reports 1 to 3. Single questions still swing,</text><text x="20" y="334" font-size="11">so test any phrase on your own task before you trust it.</text></svg>
