<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two stacked bars on OpenAI's SimpleQA test. o4-mini: 24% correct, 75% wrong, 1% abstained. gpt-5-thinking-mini: 22% correct, 26% wrong, 52% abstained."><text x="24" y="30" font-size="11">SAME FACT QUESTIONS, TWO MODELS (SIMPLEQA)</text><text x="200" y="56" font-size="11">SHARE OF ANSWERS, 0 TO 100%</text><line class="rule-s" x1="24" x2="616" y1="66" y2="66" stroke-width="1"/><text x="184" y="104" text-anchor="end" font-size="13">o4-mini</text><text x="184" y="120" text-anchor="end" font-size="10">guesses almost always</text><rect class="acc" x="200" y="88" width="96" height="36"/><text x="208" y="111" font-size="12">24% right</text><rect class="ink" x="296" y="88" width="300" height="36"/><text class="paper" x="304" y="111" font-size="12">75% wrong</text><rect class="wash" x="596" y="88" width="4" height="36"/><rect class="ink-s" x="596" y="88" width="4" height="36" fill="none" stroke-width="1"/><text x="606" y="111" font-size="11">1%</text><text x="184" y="180" text-anchor="end" font-size="13">gpt-5-thinking-mini</text><text x="184" y="196" text-anchor="end" font-size="10">says "I don't know" often</text><rect class="acc" x="200" y="164" width="88" height="36"/><text x="206" y="187" font-size="12">22% right</text><rect class="ink" x="288" y="164" width="104" height="36"/><text class="paper" x="296" y="187" font-size="12">26% wrong</text><rect class="wash" x="392" y="164" width="208" height="36"/><rect class="ink-s" x="392" y="164" width="208" height="36" fill="none" stroke-width="1"/><text x="400" y="187" font-size="12">52% abstained</text><line class="rule-s" x1="24" x2="616" y1="232" y2="232" stroke-width="1"/><text class="t-display" x="24" y="258" font-size="14">An accuracy-only scoreboard ranks the first model higher.</text><text class="t-display" x="24" y="280" font-size="14">It is wrong about three times as often.</text></svg>
